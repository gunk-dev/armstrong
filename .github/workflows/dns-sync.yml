---
name: DNS Sync

on:
  workflow_call:
    inputs:
      dry_run:
        description: "If true, print the changes that would be made without calling Porkbun."
        type: boolean
        default: false
    secrets:
      PORKBUN_API_KEY:
        required: true
      PORKBUN_SECRET_KEY:
        required: true

permissions: {}

jobs:
  dns-sync:
    runs-on: ubuntu-latest
    environment: dns
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: gunk-dev/armstrong
          path: _armstrong
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: _armstrong/go.mod

      - name: Build DNS tool
        run: go build -o dns-tool ./cmd/dns/
        working-directory: _armstrong

      - name: Install CUE
        run: |
          curl -sSL https://github.com/cue-lang/cue/releases/download/v0.9.2/cue_v0.9.2_linux_amd64.tar.gz | tar xz
          sudo mv cue /usr/local/bin/

      - name: Sync DNS records
        run: |
          set -euo pipefail
          # Per-zone layout: each dns/<zone>/ is its own CUE package exporting one
          # zone object. Flat layout (all .cue files directly in dns/) exports a
          # single zone object; both are accepted by `dns-tool sync`.
          mapfile -t zones < <(find dns -mindepth 1 -maxdepth 1 -type d | sort)
          # Trailing slash is required: without it cue treats dns/<name>.dev as a file ("unknown file extension").
          if [ ${#zones[@]} -gt 0 ]; then
            for zone in "${zones[@]}"; do
              cue vet "./$zone/"
            done
            for zone in "${zones[@]}"; do
              cue export "./$zone/" --out json
            done | jq -s . > zones.json
          else
            cue vet ./dns
            cue export ./dns --out json > zones.json
          fi
          ./_armstrong/dns-tool sync --prune${{ inputs.dry_run && ' --dry-run' || '' }} < zones.json
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
